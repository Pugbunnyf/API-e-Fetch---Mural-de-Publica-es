<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Index</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Meu mural de publicações</h1>
    <p class="intro">clique no botao para carregar e use o campo de busca para filtrar pelo título</p>
  </header>

  <main>
    <div class="controles">
      <button id="btn-carregar" type="button">Carregar publicaçoes</button>
      <input id="filtro" type="search" placeholder="Filtrar pelo título" aria-label="Filtrar publicações pelo título" />
    </div>

    <p id="mensagem" role="status"></p>

    <section id="lista-posts" aria-label="Publicações"></section>
  </main>
</body>
</html>
